version: "2"
overrides:
  go:
    overrides:
      - db_type: "timestamptz"
        go_type: "time.Time"
        engine: "postgresql"
      - db_type: "timestamptz"
        nullable: true
        engine: "postgresql"
        go_type:
          type: "time.Time"
          pointer: true
      - db_type: "uuid"
        engine: "postgresql"
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
      - db_type: "uuid"
        nullable: true
        engine: "postgresql"
        go_type:
          import: "github.com/google/uuid"
          type: "UUID"
          pointer: true

sql:
  - engine: "postgresql"
    queries: "internal/db/queries/**"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_interface: true
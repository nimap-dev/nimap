components:
  schemas:
    Address:
      additionalProperties: false
      properties:
        city:
          type: string
        country:
          description: ISO 3166-1 alpha-2 country code
          pattern: ^[A-Za-z]{2}$
          type: string
        street:
          type: string
        zip:
          description: Postal code, in whatever shape the country writes it
          type: string
      type: object
    AssetAttachmentResponse:
      additionalProperties: false
      properties:
        asset:
          $ref: "#/components/schemas/AssetResponse"
        caption:
          type: string
        id:
          type: string
      required:
        - id
        - asset
      type: object
    AssetResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AssetResponse.json
          format: uri
          readOnly: true
          type: string
        byteSize:
          format: int64
          type: integer
        contentType:
          type: string
        createdAt:
          format: date-time
          type: string
        height:
          format: int32
          type: integer
        id:
          type: string
        originalFilename:
          type: string
        title:
          type: string
        type:
          enum:
            - image
            - video
            - audio
            - document
            - other
          type: string
        width:
          format: int32
          type: integer
      required:
        - id
        - title
        - originalFilename
        - contentType
        - type
        - byteSize
        - createdAt
      type: object
    BuildingResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BuildingResponse.json
          format: uri
          readOnly: true
          type: string
        address:
          $ref: "#/components/schemas/Address"
        createdAt:
          format: date-time
          type: string
        footprint:
          $ref: "#/components/schemas/MultiPolygon"
        id:
          type: string
        locationId:
          type: string
        name:
          type: string
        notes:
          type: string
        representativePoint:
          $ref: "#/components/schemas/Point"
        status:
          enum:
            - planned
            - active
            - decommissioned
            - archived
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - footprint
        - representativePoint
        - status
        - createdAt
        - updatedAt
      type: object
    CreateBuildingRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateBuildingRequest.json
          format: uri
          readOnly: true
          type: string
        address:
          $ref: "#/components/schemas/Address"
        footprint:
          $ref: "#/components/schemas/MultiPolygon"
        locationId:
          description: The location this building stands in; omit for one that has not been placed yet
          type: string
        name:
          minLength: 1
          type: string
        notes:
          type: string
        status:
          enum:
            - planned
            - active
            - decommissioned
            - archived
          type: string
      required:
        - name
        - footprint
        - status
      type: object
    CreateDeviceModelRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateDeviceModelRequest.json
          format: uri
          readOnly: true
          type: string
        depthMm:
          format: int32
          minimum: 1
          type: integer
        deviceTypeId:
          type: string
        heightMm:
          format: int32
          minimum: 1
          type: integer
        manufacturerId:
          type: string
        mounting:
          enum:
            - rack
            - wall
            - desktop
            - din_rail
            - ceiling
            - pole
            - embedded
            - other
          type: string
        name:
          minLength: 1
          type: string
        notes:
          type: string
        partNumber:
          type: string
        poeBudgetWatts:
          description: Total power the model can supply over PoE, in watts; only with poeOut
          format: int32
          minimum: 1
          type: integer
        poeIn:
          description: Can be powered over Ethernet
          type: boolean
        poeInStandard:
          description: The PoE standard the model needs when powered over Ethernet; only with poeIn
          enum:
            - af
            - at
            - bt
            - passive
          type: string
        poeOut:
          description: Can power other devices over Ethernet
          type: boolean
        poeOutStandard:
          description: The highest PoE standard the model supplies; only with poeOut
          enum:
            - af
            - at
            - bt
            - passive
          type: string
        powerWattsMax:
          description: Maximum power draw in watts
          format: int32
          minimum: 1
          type: integer
        rackUnits:
          format: int32
          minimum: 1
          type: integer
        status:
          enum:
            - planned
            - active
            - decommissioned
            - archived
          type: string
        variant:
          description: A hardware revision or variant sold under the same name, such as rev 2
          type: string
        website:
          description: The model's page on the manufacturer's site
          type: string
        widthMm:
          format: int32
          minimum: 1
          type: integer
      required:
        - deviceTypeId
        - manufacturerId
        - name
        - status
      type: object
    CreateLocationRequest:

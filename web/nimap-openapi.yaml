components:
  schemas:
    BuildingResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BuildingResponse.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        footprint:
          $ref: "#/components/schemas/MultiPolygon"
        id:
          type: string
        name:
          type: string
        notes:
          type: string
        representativePoint:
          $ref: "#/components/schemas/Point"
        status:
          enum:
            - planned
            - active
            - decommissioned
            - archived
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - footprint
        - representativePoint
        - status
        - createdAt
        - updatedAt
      type: object
    CreateBuildingRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateBuildingRequest.json
          format: uri
          readOnly: true
          type: string
        footprint:
          $ref: "#/components/schemas/MultiPolygon"
        name:
          minLength: 1
          type: string
        notes:
          type: string
        status:
          enum:
            - planned
            - active
            - decommissioned
            - archived
          type: string
      required:
        - name
        - footprint
        - status
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/LoginInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: Account password
          minLength: 1
          type: string
        username:
          description: Account username (case-insensitive)
          examples:
            - admin
          minLength: 3
          type: string
      required:
        - username
        - password
      type: object
    MultiPolygon:
      additionalProperties: false
      properties:
        coordinates:
          description: An array of polygons, each an array of linear rings of [longitude, latitude] positions; a ring's first entry is its exterior boundary and the rest are holes
          items:
            items:
              items:
                items:
                  format: double
                  type: number
                type: array
              type: array
            type: array
          type: array
        type:
          description: GeoJSON geometry type
          enum:
            - MultiPolygon
          type: string
      required:
        - type
        - coordinates
      type: object
    Point:
      additionalProperties: false
      properties:
        coordinates:
          description: A [longitude, latitude] position, optionally with elevation
          items:
            format: double
            type: number
          maxItems: 3
          minItems: 2
          type: array
        type:
          description: GeoJSON geometry type
          enum:
            - Point
          type: string
      required:
        - type
        - coordinates
      type: object
    UpdateBuildingRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateBuildingRequest.json
          format: uri
          readOnly: true
          type: string
        footprint:
          $ref: "#/components/schemas/MultiPolygon"
        name:
          minLength: 1
          type: string
        notes:
          type: string
      required:
        - name
        - footprint
      type: object
    UpdateBuildingStatusRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/UpdateBuildingStatusRequest.json
          format: uri
          readOnly: true
          type: string
        status:
          enum:
            - planned
            - active
            - decommissioned
            - archived
          type: string
      required:
        - status
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/User.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
        role:
          type: string
        updated_at:
          format: date-time
          type: string
        username:
          type: string
      required:
        - id
        - username
        - email
        - role
        - created_at
        - updated_at
      type: object
info:
  title: nimap API
  version: dev
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log in with username and password
      tags:
        - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Log out and end the current session
      tags:
        - auth
  /api/auth/me:
    get:
      operationId: get-current-user
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Return the currently authenticated user
      tags:
        - auth
  /api/buildings:
    get:
      operationId: list-buildings
      parameters:
        - description: Lifecycle statuses to include. Defaults to planned and active, which keeps decommissioned and archived buildings off the map and out of the default lists without hiding them from a direct lookup.
          explode: false
          in: query
          name: status
          schema:
            description: Lifecycle statuses to include. Defaults to planned and active, which keeps decommissioned and archived buildings off the map and out of the default lists without hiding them from a direct lookup.
            items:
              enum:
                - planned
                - active
                - decommissioned
                - archived
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/BuildingResponse"
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Returns all buildings
      tags:
        - buildings
    post:
      operationId: create-building
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuildingRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Creates a building
      tags:
        - buildings
  /api/buildings/{id}:
    delete:
      operationId: delete-building
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Soft deletes the building with the provided id
      tags:
        - buildings
    get:
      operationId: get-building
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Returns building with the provided id
      tags:
        - buildings
    put:
      operationId: update-building
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuildingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Updates the building with the provided id
      tags:
        - buildings
  /api/buildings/{id}/status:
    patch:
      operationId: update-building-status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuildingStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Updates the building status of the building with provided id
      tags:
        - buildings

